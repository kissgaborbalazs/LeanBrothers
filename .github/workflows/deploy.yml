name: Deploy to FTP

# MIERT NEM FUTOTT SOHA (merve 2026-09-06): a trigger `branches: [ live ]` volt,
# a valodi ag viszont `Live` (nagy L). A GitHub branch-szurot kis-nagybetu
# erzekenyen illeszti, igy nulla futas lett belole -- a workflow letezett, zold
# volt a repoban, es kozben egyetlen sort sem deployolt. A `Live` ag azota
# torolve; az eles tartalom forrasa a `master`.

on:
  push:
    branches: [ master ]
  # Kezi inditas, alapertelmezetten SZARAZ probaval: az eles oldalt egy rossz
  # server-dir vagy egy elgepelt exclude azonnal elrontja, ezert a proba az
  # alapertelmezes, es a valodi feltoltes tudatos valasztas.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Szaraz proba: kiirja mit tenne, de nem tolt fel semmit'
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          # MERVE 2026-09-07, eles futasbol: az FTP-felhasznalo belepesi
          # konyvtara MAR a dokumentumgyoker. Az abszolut `/web/leanbrothers.hu/`
          # ezert NEM oda mutatott, hanem letrehozott egy ugyanilyen nevu
          # alkonyvtart a gyokeren belul, es az egesz oldal oda kerult
          # (<docroot>/web/leanbrothers.hu/index.html = bajtra a mi index.html-unk,
          # mikozben a valodi kezdolap valtozatlan maradt). A workflow "success"-t
          # jelentett, mert az FTP-oldalrol minden rendben ment -- a hiba csak az
          # eles URL-t lekerve latszott. EZERT: a feltoltes utan MINDIG az eles
          # oldalt kell megmerni, nem a workflow zold pipajat.
          server-dir: ./
          # Push eseten mindig eles; kezi inditasnal a kapcsolo dont.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          log-level: standard
          # FIGYELEM: ha ez a lista meg van adva, TELJESEN felulirja az action
          # sajat alapertelmezeset -- ezert a harom gyari mintat is fel kell
          # sorolni, kulonben a .git es a .github felkerulne a webszerverre.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md
